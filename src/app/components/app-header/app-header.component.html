<nav class="navbar navbar-expand-lg navbar-dark bg-dark-custom">
    <a 
        class="navbar-brand" 
        href=""
        [routerLink]="['']"
    >LinkWire</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
            @if (isLoggedIn) {
                <li class="nav-item">
                    <a 
                        href="" 
                        class="nav-link"
                        [routerLink]="['dashboard']"
                    >Dashboard</a>
                </li>
            } @else {
                <li class="nav-item">
                    <a 
                        href="" 
                        class="nav-link"
                        [routerLink]="['login']"
                    >Login</a>
                </li>
            }
            <li class="nav-item dropdown bg-dark-custom">
                <a 
                    class="nav-link dropdown-toggle" 
                    href="#" 
                    role="button" 
                    data-toggle="dropdown" 
                    aria-expanded="false"
                >Tools</a>
                <div class="dropdown-menu bg-dark-custom">
                    <a 
                        class="dropdown-item text-light" 
                        href="#"
                        [routerLink]="['tools', 'device-detector']"
                    >Device Detector</a>
                </div>
            </li>
        </ul>
        @if (isLoggedIn) {
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown ml-auto">
                    <a
                        class="nav-link d-flex align-items-center"
                        href="#"
                        role="button"
                        data-toggle="dropdown"
                        aria-expanded="false"
                    >
                        <i class="fa-regular fa-circle-user fa-lg"></i>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right bg-dark-custom">
                        <p 
                            class="dropdown-item text-light" 
                            role="button" 
                            (click)="openLogoutConfirmationDialog()"
                        >Log Out</p>
                        <a 
                            class="dropdown-item text-light" 
                            [routerLink]="['settings', 'change-password']"
                        >Change Password</a>
                    </div>
                </li>
            </ul>
        }
    </div>
</nav>
