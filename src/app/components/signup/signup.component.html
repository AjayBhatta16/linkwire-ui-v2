<div class="container-fluid">
    <div class="d-flex flex-column align-items-center mt-5">
        <h1 class="mb-3">Sign In</h1>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <mat-form-field>
                <input 
                    type="text" 
                    matInput 
                    placeholder="Username" 
                    formControlName="username"
                    data-testid="username-input"
                >
            </mat-form-field>
            <br/>
            <mat-form-field>
                <input 
                    type="text" 
                    matInput 
                    placeholder="E-Mail" 
                    formControlName="email"
                    data-testid="email-input"
                >
            </mat-form-field>
            <br/>
            <mat-form-field>
                <input 
                    type="password" 
                    matInput 
                    placeholder="Password" 
                    formControlName="password"
                    data-testid="password-input"
                >
            </mat-form-field>
            <br/>
            <div style="max-width: 200px;">
                <mat-checkbox formControlName="agreedToLatestTerms" data-testid="agreed-to-latest-terms-checkbox">
                    I agree to the <a href="/terms_and_conditions.pdf" target="_blank">terms and conditions</a> and <a href="/privacy_policy.pdf" target="_blank">privacy policy</a>.
                </mat-checkbox>
            </div>
            <div class="mt-0 mb-2">
                <a [routerLink]="['/login']" class="mr-3"><small>Already have an Account? Log In</small></a>
            </div>
            <small 
                class="form-text text-danger mb-2" 
                data-testid="error-text"
            >
                {{ (error$ | async) }}
            </small>
            <div class="button">
                <button 
                    type="submit" 
                    mat-raised-button 
                    color="primary"
                    [disabled]="(loading$ | async) ?? false"
                    data-testid="submit-button"
                >Sign Up</button>
            </div>
        </form>
    </div>
</div>
