<div class="container-fluid">
    @if (!success()) {
        <div class="d-flex flex-column align-items-center mt-5">
            <h2 class="mb-3">
                Change Password
            </h2>
            <form class="mt-5" [formGroup]="form" (ngSubmit)="onSubmit()">
                <mat-form-field>
                    <input 
                        type="password" 
                        matInput 
                        placeholder="Current Password" 
                        formControlName="oldPassword"
                    >
                </mat-form-field>
                <br/>
                <mat-form-field>
                    <input 
                        type="password" 
                        matInput 
                        placeholder="New Password" 
                        formControlName="newPassword"
                    >
                </mat-form-field>
                <br/>
                <mat-form-field>
                    <input 
                        type="password" 
                        matInput 
                        placeholder="Confirm Password" 
                        formControlName="confirmPassword"
                    >
                </mat-form-field>
                <br/>
                <small 
                    class="form-text text-danger mb-2" 
                >
                    {{ displayError() }}
                </small>
                <div class="button">
                    <button 
                        type="submit" 
                        mat-raised-button 
                        color="primary"
                    >Update Password</button>
                </div>
            </form>
        </div>
    }
    @if (success()) {
        <linkwire-success-status-jumbotron
            headerText="Password reset successful!"
            detailText="Your password has been updated successfully."
            buttonText="Proceed to Dashboard"
            (buttonClick)="navigateToDashboard()"
        />
    }
</div>
