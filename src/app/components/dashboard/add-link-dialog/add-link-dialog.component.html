<h2 class="text-center" mat-dialog-title>Create Link</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <div class="w-75 mx-auto">
      <mat-form-field class="w-100">
        <input 
            type="text"
            class="w-100" 
            matInput 
            placeholder="Target URL" 
            formControlName="redirectURL"
            data-testid="target-url-input"
        >
      </mat-form-field>
      <br/>
      <mat-form-field class="w-100">
        <input 
            type="text" 
            class="w-100"
            matInput 
            placeholder="Note" 
            formControlName="note"
            data-testid="note-input"
        >
      </mat-form-field>
      <br/>
      <small 
        class="form-text text-danger mb-2" 
        data-testid="error-text"
      >{{ (error$ | async) }}</small>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button 
    mat-raised-button 
    mat-dialog-close
    color="primary"
    [disabled]="(loading$ | async) ?? false"
  >Cancel</button>
  <button 
    mat-raised-button
    color="primary"
    [disabled]="(loading$ | async) ?? false"
    (click)="onSubmit()"
    data-testid="submit-button"
  >Save</button>
</mat-dialog-actions>
