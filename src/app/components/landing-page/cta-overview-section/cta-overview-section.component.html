<div class="container landing-page-segment">
    <div class="d-flex flex-column align-items-center mt-5">
        <img 
            src="/linkwire-logo.png" 
            alt="LinkWire Logo" 
            width="100" 
            height="100"
            class="mt-5"
        />
        <h1 class="mt-5">LinkWire</h1>
        <h6 class="mt-2 text-center">The URL Shortener & Web Traffic Analytics Platform</h6>
        <div class="d-flex flex-row justify-content-center mt-5">
            <a [routerLink]="['signup']">
                <button class="btn mt-3 px-4 py-3" data-testid="signup-button">Join Today</button>
            </a>
        </div>
    </div>
</div>
